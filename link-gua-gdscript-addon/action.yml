name: Link Gua GDScript Addon
description: Download gua-project/gua's released Godot addon and copy it into a Godot project.

inputs:
  gua-repository:
    description: Repository containing Gua Godot plugin releases.
    required: false
    default: gua-project/gua
  gua-source-commit:
    description: Expected native Gua source SHA (40 lowercase hex). Empty resolves the release tag; asset mirrors may supply the original upstream commit.
    required: false
    default: ""
  gua-plugin-tag:
    description: Gua release tag. Leave empty to use the latest stable gua-v* release containing a matching addon asset.
    required: false
    default: ""
  gua-plugin-asset-pattern:
    description: Asset name wildcard used to select the addon zip from the release.
    required: false
    default: gua-godot-addon-*.zip
  project-path:
    description: Path to the consumer Godot project directory.
    required: false
    default: game

outputs:
  gua-tag:
    description: Exact resolved Gua release tag (pin this alongside the test SDK).
    value: ${{ steps.link-gua-addon.outputs.gua-tag }}
  gua-source-commit:
    description: Expected native source commit (tag-derived or explicitly supplied).
    value: ${{ steps.link-gua-addon.outputs.gua-source-commit }}
  gua-asset-sha256:
    description: SHA256 of the downloaded addon archive, checked against the release digest when provided.
    value: ${{ steps.link-gua-addon.outputs.gua-asset-sha256 }}
  addon-path:
    description: Path where the addon was copied inside the Godot project.
    value: ${{ inputs.project-path }}/addons/gua

runs:
  using: composite
  steps:
    - name: Download and copy addon into Godot project
      id: link-gua-addon
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GUA_EXPECTED_SOURCE_COMMIT: ${{ inputs.gua-source-commit }}
      run: |
        $ErrorActionPreference = "Stop"
        $repository = "${{ inputs.gua-repository }}"
        $tag = "${{ inputs.gua-plugin-tag }}"
        $assetPattern = "${{ inputs.gua-plugin-asset-pattern }}"
        $assetPatterns = @($assetPattern)
        if ($assetPattern -eq "gua-godot-addon-*.zip" -and $env:RUNNER_OS -eq "Windows") {
          $assetPatterns += "gua-godot-plugin-windows-debug-*.zip"
        }
        $headers = @{ "User-Agent" = "gua-godot-actions" }
        $downloadHeaders = @{ "User-Agent" = "gua-godot-actions" }
        if (![string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) { $headers.Authorization = "Bearer $($env:GITHUB_TOKEN)" }

        function Find-AddonAsset($release) {
          foreach ($pattern in $assetPatterns) {
            $match = $release.assets | Where-Object { $_.name -like $pattern } | Select-Object -First 1
            if ($null -ne $match) { return $match }
          }
          return $null
        }

        if ([string]::IsNullOrWhiteSpace($tag)) {
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${repository}/releases" -Headers $headers
          $release = $releases |
            Where-Object {
              -not $_.draft -and
              -not $_.prerelease -and
              $_.tag_name -like "gua-v*" -and
              $null -ne (Find-AddonAsset $_)
            } |
            Select-Object -First 1

          if ($null -eq $release) {
            $release = $releases |
              Where-Object {
                -not $_.draft -and
                -not $_.prerelease -and
                $_.tag_name -like "godot-plugin-*" -and
                $null -ne (Find-AddonAsset $_)
              } |
              Select-Object -First 1
          }

          if ($null -eq $release) {
            throw "No stable gua-v* or legacy godot-plugin-* release containing a supported addon asset was found in ${repository}."
          }
        } else {
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${repository}/releases/tags/${tag}" -Headers $headers
        }

        # Resolve native source commit (a distribution repository may mirror upstream assets).
        $sourceCommit = $env:GUA_EXPECTED_SOURCE_COMMIT
        if ([string]::IsNullOrWhiteSpace($sourceCommit)) {
          $reference = Invoke-RestMethod -Uri "https://api.github.com/repos/${repository}/git/ref/tags/$([uri]::EscapeDataString($release.tag_name))" -Headers $headers
          $object = $reference.object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 5; $depth++) {
            $reference = Invoke-RestMethod -Uri "https://api.github.com/repos/${repository}/git/tags/$($object.sha)" -Headers $headers
            $object = $reference.object
          }
          if ($object.type -ne 'commit' -or $object.sha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve the Gua release tag to a source commit.' }
          $sourceCommit = $object.sha
        } elseif ($sourceCommit -cnotmatch '^[0-9a-f]{40}$') {
          throw 'gua-source-commit must be a full 40-character lowercase hexadecimal source SHA.'
        }
        # End native source commit resolution.
        $asset = Find-AddonAsset $release
        if ($null -eq $asset) {
          $patternsText = $assetPatterns -join "', '"
          throw "No release asset matching one of '${patternsText}' was found in release '$($release.tag_name)'."
        }

        $downloadDir = Join-Path $env:RUNNER_TEMP ("gua-godot-addon-" + [guid]::NewGuid().ToString("N"))
        $archivePath = Join-Path $downloadDir $asset.name
        $extractDir = Join-Path $downloadDir "extract"
        New-Item -ItemType Directory -Force $downloadDir | Out-Null
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath -Headers $downloadHeaders
        $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($asset.digest -and $asset.digest -ne "sha256:$archiveHash") {
          throw "Gua addon archive digest does not match the release asset."
        }
        Write-Host "Gua addon release=$($release.tag_name) asset=$($asset.name) sha256=$archiveHash"
        if ($env:GITHUB_OUTPUT) {
          "gua-source-commit=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "gua-tag=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "gua-asset-sha256=$archiveHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        }
        Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force

        $sourceAddon = Join-Path $extractDir "addons/gua"
        if (!(Test-Path -LiteralPath $sourceAddon)) {
          throw "The release asset '$($asset.name)' does not contain addons/gua."
        }
        $extensionName = switch ($env:RUNNER_OS) {
          "Windows" { "gua_godot.windows.debug.x86_64.dll" }
          "Linux" { "gua_godot.linux.debug.x86_64.so" }
          "macOS" { if ($env:RUNNER_ARCH -eq "ARM64") { "gua_godot.macos.debug.arm64.dylib" } else { "gua_godot.macos.debug.x86_64.dylib" } }
          default { throw "Unsupported GitHub runner OS '$env:RUNNER_OS'." }
        }
        $extension = Join-Path $sourceAddon "bin/$extensionName"
        if (!(Test-Path -LiteralPath $extension)) {
          throw "The release asset '$($asset.name)' is missing '$extensionName'."
        }

        $workspace = [IO.Path]::GetFullPath((Get-Location).Path)
        $project = [IO.Path]::GetFullPath("${{ inputs.project-path }}", $workspace)
        if ($project -ne $workspace -and !$project.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
          throw "project-path must remain inside the working directory."
        }
        $addonParent = Join-Path $project "addons"
        $targetAddon = Join-Path $addonParent "gua"
        New-Item -ItemType Directory -Force $addonParent | Out-Null
        if (Test-Path -LiteralPath $targetAddon) {
          Remove-Item -LiteralPath $targetAddon -Recurse -Force
        }
        Copy-Item -LiteralPath $sourceAddon -Destination $targetAddon -Recurse -Force
