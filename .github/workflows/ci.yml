name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-integration-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test migrated release installers (latest stable)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tests/release-integration-smoke.ps1
      - name: Test migrated release installers (explicit tag)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tests/release-integration-smoke.ps1 -GuaTag gua-v1.0.10

  action-contract-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public action contracts
        shell: pwsh
        run: ./tests/action-contract-smoke.ps1

  visual-report-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test visual report site builder
        shell: pwsh
        run: ./tests/visual-report-smoke.ps1

  visual-report-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-report/viewer-src
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install viewer development dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Check and build viewer
        run: bun run build
      - name: Test viewer
        run: node node_modules/playwright/cli.js test
      - name: Verify bundled viewer is current
        run: |
          bun run build:release
          git diff --exit-code -- ../viewer
