name: Unity reusable workflow smoke

on:
  pull_request:
    paths:
      - .github/workflows/unity.yml
      - .github/workflows/unity-smoke.yml
      - README.md
      - README.ja.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/unity.yml
      - .github/workflows/unity-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/unity.yml
    with:
      checkout-repository: gua-project/gua
      checkout-ref: 2e12fb3cfdf822418f349515027d6f620c5ee63b # gua-v1.2.0
      project-path: examples/unity-smoke
      scene-path: Assets/Scenes/GuaUnityFixture.unity
      test-project: bindings/dotnet/tests/Gua.Unity.Integration.Tests/Gua.Unity.Integration.Tests.csproj
      artifact-key: unity-smoke
      unity-version: 6000.5.3f1
      gua-tag: gua-v1.2.0
      gua-build-variant: development
      artifact-path: artifacts/gua
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
